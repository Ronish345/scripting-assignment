<!DOCTYPE html>
<html>
<head>
<title>Student Information</title>

<style>
table {
    border-collapse: collapse;
    width: 90%;
    margin: 30px auto;
}

th, td {
    border: 1px solid black;
    padding: 8px;
    text-align: center;
}

th {
    background: lightgreen;
}

h2 {
    text-align: center;
}

button {
    display: block;
    margin: 20px auto;
    padding: 8px 15px;
}
</style>
</head>

<body>

<h2>Student Information</h2>

<button onclick="loadStudents()">Load Students</button>

<table id="studentTable">

<tr>
<th>Student ID</th>
<th>Name</th>
<th>Course</th>
<th>Semester</th>
<th>Email</th>
</tr>

</table>

<script>

function loadStudents() {

    let x = new XMLHttpRequest();

    x.open("GET", "students.xml", true);

    x.onload = function() {

        let xml = x.responseXML;
        let students = xml.getElementsByTagName("student");
        let table = document.getElementById("studentTable");

        for (let i = 0; i < students.length; i++) {

            let row = table.insertRow();

            row.insertCell(0).innerHTML =
                students[i].getElementsByTagName("id")[0].textContent;

            row.insertCell(1).innerHTML =
                students[i].getElementsByTagName("name")[0].textContent;

            row.insertCell(2).innerHTML =
                students[i].getElementsByTagName("course")[0].textContent;

            row.insertCell(3).innerHTML =
                students[i].getElementsByTagName("semester")[0].textContent;

            row.insertCell(4).innerHTML =
                students[i].getElementsByTagName("email")[0].textContent;
        }
    };

    x.send();
}

</script>

</body>
</html>
