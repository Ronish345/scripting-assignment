<!DOCTYPE html>
<html>
<head>
<title>Student Registration Form</title>

<style>
body {
    font-family: Arial;
}

input {
    padding: 6px;
    margin: 5px;
}

button {
    padding: 6px 12px;
}

#message {
    margin-top: 20px;
}
</style>
</head>

<body>

<h1>Student Registration Form</h1>

<form id="form">

Name:
<input type="text" id="name" value="Ronish Das">
<br><br>

Roll Number:
<input type="text" id="roll" value="2081026">
<br><br>

Course:
<input type="text" id="course" value="BCA">
<br><br>

Semester:
<input type="number" id="semester" value="4">
<br><br>

<button type="submit">Register</button>

</form>

<p id="message"></p>

<script>

document.getElementById("form").onsubmit = function(e) {

    e.preventDefault();

    let x = new XMLHttpRequest();

    x.open("POST", "register.php", true);

    x.setRequestHeader(
        "Content-Type",
        "application/x-www-form-urlencoded"
    );

    x.onload = function() {
        document.getElementById("message").innerHTML =
            x.responseText;
    };

    let data =
        "name=" + encodeURIComponent(document.getElementById("name").value) +
        "&roll=" + encodeURIComponent(document.getElementById("roll").value) +
        "&course=" + encodeURIComponent(document.getElementById("course").value) +
        "&semester=" + encodeURIComponent(document.getElementById("semester").value);

    x.send(data);
};

</script>

</body>
</html>
